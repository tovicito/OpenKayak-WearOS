name: OpenKayak v2.6 · integración Android + web

on:
  push:
    branches:
      - integration/main-to-native-v2.6
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    name: Build and test web + Wear OS + Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build web application from Main
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build native APKs and run unit tests
        run: ./gradlew --no-daemon clean testDebugUnitTest :app:assembleDebug :phone:assembleDebug --stacktrace

      - name: Name real installable APKs
        run: |
          mkdir -p dist
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s phone/build/outputs/apk/debug/phone-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/OpenKayak-v2.6-WearOS.apk
          cp phone/build/outputs/apk/debug/phone-debug.apk dist/OpenKayak-v2.6-Android.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          file dist/*.apk

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openkayak-v2.6-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish v2.6 pre-release with both native APKs
        if: success() && github.ref == 'refs/heads/integration/main-to-native-v2.6'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.6
          target_commitish: ${{ github.sha }}
          name: OpenKayak v2.6 · coach Gemini y escucha local optativa
          prerelease: true
          draft: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/OpenKayak-v2.6-WearOS.apk
            dist/OpenKayak-v2.6-Android.apk
            dist/SHA256SUMS.txt
          body: |
            OpenKayak v2.6 · integración nativa de cambios de Main y funciones móviles.
            - Wear OS: escucha optativa de «Hola reloj» con el reconocedor local, solo mientras la app está en primer plano y la pantalla interactiva.
            - Wear OS: detector de paladas sin periodo refractario adicional y con validación de regularidad temporal.
            - Android móvil: pestaña Coach IA conectada a Gemini y campo de clave API.
            - La clave del usuario se cifra en Android Keystore y solo queda en el móvil; no se sincroniza al reloj.
            - El coach necesita Internet; la pregunta y el resumen de entrenamientos usado como contexto se envían a Google.
            - Se mantienen GPX real, mapa, circuitos/boyas, sincronización Wear OS y Health Connect disponible en el reloj.
            - SHA256SUMS.txt permite verificar la integridad de los APK.
            Ambos archivos son APK debug para pruebas, no builds firmados para Google Play. La compatibilidad del reconocimiento local y la calidad de paladas/GPS deben comprobarse en el dispositivo real.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
