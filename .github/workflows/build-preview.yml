name: OpenKayak v2.2.2 · reliable sync repair

on:
  push:
    branches:
      - rebuild/wearos5-expressive-oct2026
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    name: Build Wear OS + phone APKs (JDK 17 / Android 36)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build and unit tests
        run: ./gradlew --no-daemon clean testDebugUnitTest :app:assembleDebug :phone:assembleDebug --stacktrace

      - name: Name installable APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OpenKayak-v2.2.2-sync-repair-WearOS.apk
          cp phone/build/outputs/apk/debug/phone-debug.apk dist/OpenKayak-v2.2.2-sync-repair-Android.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openkayak-v2.2.2-sync-repair-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish the two APKs together in one GitHub pre-release
        if: success() && github.ref == 'refs/heads/rebuild/wearos5-expressive-oct2026'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.2-sync-repair
          target_commitish: ${{ github.sha }}
          name: OpenKayak v2.2.2 · sincronización fiable
          prerelease: true
          draft: false
          files: |
            dist/OpenKayak-v2.1.color-WearOS.apk
            dist/OpenKayak-v2.1.color-Android.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            OpenKayak v2.2.2-sync-repair. Ambos APK son builds debug para pruebas.
            - OpenKayak-v2.1.color-WearOS.apk: app para Wear OS; incluye reenvío fiable de entrenamientos y circuitos mediante Wear OS Data Layer.
            - OpenKayak-v2.1.color-Android.apk: app móvil; recibe entrenamientos y circuitos, conserva rutas existentes si falla una transferencia GPX y refleja el borrado de circuitos.
            - SHA256SUMS.txt: hashes SHA-256 para verificar las descargas.
            Cada reintento genera una revisión nueva del Data Layer para que la sincronización manual vuelva a disparar eventos aunque los datos no hayan cambiado. Las escrituras esperan confirmación y registran errores. Cambios limitados a la capa de sincronización, sin modificar pantallas ni lógica de entrenamiento.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
