name: OpenKayak v2.7 · AAB + APK · Wear OS + Android

on:
  push:
    branches:
      - integration/main-to-native-v2.6
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    name: Build and test web + Wear OS + Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Commit refreshed npm lockfile if needed
        id: lockfile
        run: |
          if [[ "${GITHUB_REF_NAME}" != "integration/main-to-native-v2.6" ]] || git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(web): sync npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Build web application
        run: npm run build

      - name: Run Android unit tests and build AABs + debug APKs
        run: ./gradlew --no-daemon clean testDebugUnitTest :app:bundleRelease :phone:bundleRelease :app:assembleDebug :phone:assembleDebug --stacktrace

      - name: Collect and validate native packages
        run: |
          mkdir -p dist
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s phone/build/outputs/bundle/release/phone-release.aab
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s phone/build/outputs/apk/debug/phone-debug.apk

          cp app/build/outputs/bundle/release/app-release.aab dist/OpenKayak-v2.7-WearOS.aab
          cp phone/build/outputs/bundle/release/phone-release.aab dist/OpenKayak-v2.7-Android.aab
          cp app/build/outputs/apk/debug/app-debug.apk dist/OpenKayak-v2.7-WearOS-debug.apk
          cp phone/build/outputs/apk/debug/phone-debug.apk dist/OpenKayak-v2.7-Android-debug.apk

          for package in dist/*.aab; do
            unzip -t "$package"
            unzip -l "$package" | grep -q 'base/manifest/AndroidManifest.xml'
          done
          for package in dist/*.apk; do
            unzip -t "$package"
            unzip -l "$package" | grep -q 'AndroidManifest.xml'
            unzip -l "$package" | grep -q 'classes.dex'
          done
          sha256sum dist/*.aab dist/*.apk | tee dist/SHA256SUMS.txt
          file dist/*.aab dist/*.apk

      - name: Upload AABs and debug APKs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openkayak-v2.7-aab-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish v2.7 pre-release with AABs and debug APKs
        if: success() && github.ref == 'refs/heads/integration/main-to-native-v2.6'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7
          target_commitish: ${{ github.sha }}
          name: OpenKayak v2.7 · paquetes AAB + APK
          prerelease: true
          draft: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/OpenKayak-v2.7-WearOS.aab
            dist/OpenKayak-v2.7-Android.aab
            dist/OpenKayak-v2.7-WearOS-debug.apk
            dist/OpenKayak-v2.7-Android-debug.apk
            dist/SHA256SUMS.txt
          body: |
            OpenKayak v2.7 · empaquetado AAB añadido para Wear OS y Android.
            - AAB de variante release para reloj y móvil, construidos con Gradle.
            - APK debug separados para instalar y probar directamente en dispositivos.
            - Tests unitarios Android y build web ejecutados antes de publicar.
            - SHA256SUMS.txt incluye hashes de los cuatro paquetes.
            IMPORTANTE: estos AAB se compilan en variante release, pero no se firman con una clave de subida de Google Play en este workflow. Antes de subirlos a Google Play hay que configurar una clave de firma de publicación y su configuración segura en GitHub Actions. Los APK debug son para pruebas y no para publicar en Play.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
