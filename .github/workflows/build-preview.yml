name: OpenKayak v2.1 · build, tests and release

on:
  push:
    branches:
      - rebuild/wearos5-expressive-oct2026
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    name: Build Wear OS + phone APKs (JDK 17 / Android 36)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build and unit tests
        run: ./gradlew --no-daemon clean testDebugUnitTest :app:assembleDebug :phone:assembleDebug --stacktrace

      - name: Name installable APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug-watch.apk
          cp phone/build/outputs/apk/debug/phone-debug.apk dist/app-debug-phone.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openkayak-v2.1-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish the two APKs together in one GitHub pre-release
        if: success() && github.ref == 'refs/heads/rebuild/wearos5-expressive-oct2026'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1-preview-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: OpenKayak v2.1
          prerelease: true
          draft: false
          files: |
            dist/app-debug-watch.apk
            dist/app-debug-phone.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            OpenKayak v2.1 preview. Ambos APK son builds debug para pruebas.
            - app-debug-watch.apk: Wear OS.
            - app-debug-phone.apk: Android móvil, emparejado con la app del reloj mediante Wear OS Data Layer.
            - SHA256SUMS.txt: hashes para verificar la descarga.
            Esta versión debe probarse en el agua antes de confiar en las métricas. Los datos de mapas usan OpenStreetMap.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
