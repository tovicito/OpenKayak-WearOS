name: OpenKayak v2.4 · workout analytics

on:
  push:
    branches:
      - rebuild/wearos5-expressive-oct2026
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    name: Build Wear OS + phone APKs (JDK 17 / Android 36)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build and unit tests
        run: ./gradlew --no-daemon clean testDebugUnitTest :app:assembleDebug :phone:assembleDebug --stacktrace

      - name: Name installable APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OpenKayak-v2.4-WearOS.apk
          cp phone/build/outputs/apk/debug/phone-debug.apk dist/OpenKayak-v2.4-Android.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openkayak-v2.4-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish the two APKs together in one GitHub pre-release
        if: success() && github.ref == 'refs/heads/rebuild/wearos5-expressive-oct2026'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4
          target_commitish: ${{ github.sha }}
          name: OpenKayak v2.4 · mapa GPS y circuitos GPX
          prerelease: true
          draft: false
          overwrite_files: true
          files: |
            dist/OpenKayak-v2.4-WearOS.apk
            dist/OpenKayak-v2.4-Android.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            OpenKayak v2.4 · correcciones del mapa GPS y circuitos GPX. Ambos APK son builds debug para pruebas.
            - OpenKayak-v2.4-WearOS.apk: centra el mapa en la posición GPS disponible y muestra en la página de ruta los circuitos GPX importados desde el móvil. La línea del circuito usa el color configurado en Ajustes.
            - OpenKayak-v2.4-Android.apk: mantiene la importación GPX, sincronización de circuitos y selector de color de ruta.
            - SHA256SUMS.txt: hashes SHA-256 para verificar las descargas.
            El análisis GPX del reloj admite puntos trkpt, rtept y wpt, incluidos archivos sin marcas de tiempo. El circuito se transfiere mediante Wear OS Data Layer. Los APK son builds debug de prueba; comprueba la sincronización con ambos dispositivos conectados.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
