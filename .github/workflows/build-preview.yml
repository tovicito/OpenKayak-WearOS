name: OpenKayak v2.2 · phone workout analytics

on:
  push:
    branches:
      - rebuild/wearos5-expressive-oct2026
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    name: Build Wear OS + phone APKs (JDK 17 / Android 36)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build and unit tests
        run: ./gradlew --no-daemon clean testDebugUnitTest :app:assembleDebug :phone:assembleDebug --stacktrace

      - name: Name installable APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/OpenKayak-v2.2.analytics-WearOS.apk
          cp phone/build/outputs/apk/debug/phone-debug.apk dist/OpenKayak-v2.2.analytics-Android.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openkayak-v2.2.analytics-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish the two APKs together in one GitHub pre-release
        if: success() && (github.ref == 'refs/heads/rebuild/wearos5-expressive-oct2026' || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.analytics
          target_commitish: ${{ github.sha }}
          name: OpenKayak v2.2 · análisis de entrenamientos en el móvil
          prerelease: true
          draft: false
          files: |
            dist/OpenKayak-v2.2.analytics-WearOS.apk
            dist/OpenKayak-v2.2.analytics-Android.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            OpenKayak v2.2 · análisis de entrenamientos en el móvil. Ambos APK son builds debug para pruebas.
            - OpenKayak-v2.2.analytics-WearOS.apk: app para Wear OS. El código del reloj no se ha modificado en esta actualización.
            - OpenKayak-v2.2.analytics-Android.apk: app móvil con análisis ampliado del entrenamiento, gráficas de FC y velocidad, tabla de intervalos de 10 segundos, perfil de altura/peso/edad y borrado local de sesiones.
            - SHA256SUMS.txt: hashes SHA-256 para verificar las descargas.
            El análisis se abre desde el historial del móvil. El borrado afecta solo al historial local del móvil y no envía órdenes de borrado al reloj. Ambos APK son builds debug de prueba; las calorías alternativas son estimaciones y las gráficas solo muestran muestras disponibles.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
