name: Android build

on:
  push:
    branches:
      - fix/learned-buoys-circuits
      - fix/map-downloader-aod
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: openkayak-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Put compiled APK in repository root
        run: cp app/build/outputs/apk/debug/app-debug.apk openkayak-debug.apk

      - name: Commit compiled APK to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openkayak-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "build: update compiled debug APK [skip ci]"
            git push
          fi
