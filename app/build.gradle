plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.openkayak.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.openkayak.app"
        minSdk 30
        targetSdk 36
        versionCode 2
        versionName "2.0.0-preview.1"

        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += '/META-INDEX/AL2.0'
            excludes += '/META-INDEX/LGPL2.1'
        }
    }
}

dependencies {
    // Legacy Wear Material is retained for the previous non-launcher screens during migration.
    implementation 'androidx.wear.compose:compose-material:1.7.1'
    implementation 'androidx.wear.compose:compose-material3:1.7.1'
    implementation 'androidx.wear.compose:compose-foundation:1.7.1'
    implementation 'androidx.wear.compose:compose-navigation:1.7.1'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear:wear-phone-interactions:1.0.1'
    implementation 'androidx.wear:wear-remote-interactions:1.0.0'

    // Ambient Mode / AOD
    implementation 'androidx.wear:wear-ongoing:1.0.0'

    // AndroidX Health Connect (Health Connect Integration)
    implementation 'androidx.health.connect:connect-client:1.1.0'

    // AndroidX Core & Lifecycle
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.10.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // Compose Core
    implementation 'androidx.compose.ui:ui:1.9.4'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.9.4'
    implementation 'androidx.compose.runtime:runtime:1.9.4'
    implementation 'androidx.compose.material:material-icons-core:1.12.1'

    // Google Play Services Location (GPS)
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // Room Database
    def roomVersion = "2.6.1"
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    kapt "androidx.room:room-compiler:$roomVersion"

    // Osmdroid (Offline Maps)
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
}
